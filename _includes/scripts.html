<script defer src="{{ base_path }}/assets/js/main.min.js?v={{ site.time | date: '%s' }}"></script>

{% if site.search %}
<script defer src="{{ base_path }}/assets/js/search.js?v={{ site.time | date: '%s' }}"></script>
{% endif %}

{% if content contains 'language-plotly' %}
<!-- Plotly is heavy (~4.5 MB) — load it only on pages that use ```plotly blocks -->
<script type="module" src="{{ base_path }}/assets/js/plotly-blocks.js?v={{ site.time | date: '%s' }}"></script>
{% endif %}

{% include analytics.html %}

{% include comments-providers/scripts.html %}

<script>
  console.log(
    "%cSTOP!\n%cThis is the personal repository of Dr. Ozgur Ural.\nThis code is NOT a template. Do NOT clone, fork, or reuse without explicit permission.",
    "color: red; font-size: 40px; font-weight: bold; -webkit-text-stroke: 1px black;",
    "color: white; font-size: 16px; background: black; padding: 10px; border-radius: 5px;"
  );
</script>

<!-- tsParticles. Deferred: the field is decorative, and letting it wait until
     the document is parsed keeps 38 KB of it out of the way of the fonts and
     the first paint. defer preserves document order, so shared still runs
     before config, and it executes before DOMContentLoaded, which is what
     config listens for. -->
<script defer src="{{ base_path }}/assets/js/tsparticles.bundle.min.js"></script>
<!-- Shared field options must load before both consumers (this file and the
     home-only topology script) read them at DOMContentLoaded. -->
<script defer src="{{ base_path }}/assets/js/particles-shared.js?v={{ site.time | date: '%s' }}"></script>
<script defer src="{{ base_path }}/assets/js/particles-config.js?v={{ site.time | date: '%s' }}"></script>
