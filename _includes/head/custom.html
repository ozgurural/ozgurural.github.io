{% include base_path %}

<!-- start custom head snippets -->

<script>
  /* Force dark mode — light mode removed */
  document.documentElement.setAttribute("data-theme", "dark");
</script>

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Favicons & PWA -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="192x192" href="{{ base_path }}/images/favicon-192x192.png">
<link rel="icon" href="{{ base_path }}/images/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png">
<link rel="manifest" href="{{ base_path }}/images/manifest.json">
<meta name="theme-color" content="#0a0f1c">

<!-- Inter (body), Space Grotesk (display), JetBrains Mono (code), self-hosted:
     see scripts/vendor-webfonts.js. Only body text is preloaded, so the display
     and mono faces do not compete with it for the first paint.

     The filename comes from site.data.webfonts rather than being typed here:
     which weights end up sharing one physical file is decided by the script
     (Google can repack its variable-font ranges any time it likes), so a name
     hardcoded into this include is one repack away from preloading a 404. The
     guard below is the fallback for that anyway, since a stale checkout
     without assets/webfonts/gf/ built yet should render without asking the
     browser for a font that isn't there rather than emit a link with an
     empty href. -->
{% if site.data.webfonts.preload_font %}
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="{{ base_path }}/assets/webfonts/gf/{{ site.data.webfonts.preload_font }}">
{% endif %}

{% if page.url == "/" or page.url == "/index.html" %}
<!-- The particle field is decorative and aria-hidden, and it was preloaded at
     high priority on the one page whose largest paint matters most, where it
     competed with the fonts and the hero for bandwidth. It loads at the end of
     body like everything else. -->
<!-- On the home page the hero supplies the H1 — hide duplicate page__title -->
<script>document.documentElement.classList.add('ep-home');</script>
{% endif %}

<!-- Prerender same-site pages when a link is hovered, so tab clicks feel
     instant instead of flashing a blank frame (progressive enhancement) -->
<script type="speculationrules">
{
  "prerender": [{
    "where": { "and": [
      { "href_matches": "/*" },
      { "not": { "href_matches": "/*.pdf" } },
      { "not": { "selector_matches": "[download]" } }
    ]},
    "eagerness": "moderate"
  }]
}
</script>

<!-- end custom head snippets -->
