<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="Dr. Ozgur Ural Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%s' }}">

{% if page.oembed %}
  <!-- oEmbed discovery: consumers that support it (Notion, WordPress, Ghost,
       Confluence) turn a pasted link into the embedded player on their own.
       The href is a static file per film rather than the usual ?url= endpoint,
       because this is a static host and the consumer only ever GETs it. -->
  <link rel="alternate" type="application/json+oembed"
        href="{{ page.oembed | absolute_url }}"
        title="{{ page.title | escape }}">
{% endif %}

{% include head/custom.html %}
