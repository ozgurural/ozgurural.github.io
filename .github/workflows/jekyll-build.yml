name: Jekyll Build Check
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Lockfiles are not tracked in this repository, so npm ci is unavailable.
      # The test uses committed assets and needs only production dependencies.
      - name: Install browser test dependencies
        run: npm install --omit=dev --no-package-lock
      - run: bundle exec jekyll build --safe
        env:
          JEKYLL_ENV: production
      - name: Build local preview for keyboard checks
        run: bundle exec jekyll build --safe --config _config.yml,_config.dev4001.yml --destination dist/ci-site
      - name: Test cinema playback and keyboard controls
        env:
          CI: 'true'
          FILM_BASE: http://localhost:4001
        run: |
          bundle exec jekyll serve --safe --skip-initial-build --no-watch --host 127.0.0.1 --port 4001 --config _config.yml,_config.dev4001.yml --destination dist/ci-site > dist/ci-jekyll.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null "$FILM_BASE/films/level-d/?autoplay=0"; then
              npm run test:cinema-controls
              npm run test:cinema-playback
              npm run test:cinema-cyber-events
              npm run test:cinema-blockchain-ml
              npm run test:cinema-model-heist
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat dist/ci-jekyll.log
              exit 1
            fi
            sleep 1
          done

          cat dist/ci-jekyll.log
          echo 'The local Jekyll server did not become ready in time.' >&2
          exit 1
